[package]
name = "tasks"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }

[[bin]]
name = "parked"
path = "src/parked.rs"

[[bin]]
name = "parked_deep"
path = "src/parked_deep.rs"

[[bin]]
name = "ping_pong"
path = "src/ping_pong.rs"

[[bin]]
name = "locks"
path = "src/locks.rs"

[[bin]]
name = "async_locks"
path = "src/async_locks.rs"
