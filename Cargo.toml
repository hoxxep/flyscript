[package]
name = "flyscript"
version = "0.1.0"
edition = "2024"
description = "Prototype compiler for the Flyscript language"
license = "MIT OR Apache-2.0"
authors = ["Fieldwork AI Inc."]
repository = "https://github.com/rogersnm/flyscript"

[[bin]]
name = "flyc"
path = "src/main.rs"

[dependencies]

# The tests run whole programs, the self-hosted compiler among them, in the interpreter.
[profile.test]
opt-level = 2
